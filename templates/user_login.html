<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelGo - Journey Awaits</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.7)), 
                        url('https://images.unsplash.com/photo-1541417904950-b855846fe074?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover fixed;
        }
        .auth-container { width: 100%; max-width: 440px; padding: 20px; z-index: 10; }
        .glass-card {
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12); padding: 40px 35px; border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }
        .top-switcher { display: flex; gap: 12px; margin-bottom: 30px; }
        .switch-btn { flex: 1; text-align: center; padding: 12px; font-size: 13px; font-weight: 700; text-decoration: none; border-radius: 12px; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        .admin-pill { background: rgba(255, 255, 255, 0.06); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.08); }
        .admin-pill:hover { background: rgba(255, 255, 255, 0.15); color: white; }
        .signup-pill { background: rgba(56, 189, 248, 0.12); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.25); }
        .signup-pill:hover { background: #38bdf8; color: #0f172a; }

        .brand-header { text-align: center; margin-bottom: 30px; }
        .brand-header h1 { font-size: 32px; font-weight: 700; color: #f8fafc; }
        .brand-header h1 span { color: #38bdf8; text-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }
        .brand-header p { color: #94a3b8; font-size: 14px; margin-top: 6px; }

        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.75px; }
        .input-style { width: 100%; padding: 14px 18px; background: rgba(15, 23, 42, 0.75); border: 2px solid #334155; border-radius: 14px; color: white; font-size: 15px; outline: none; transition: all 0.2s; }
        .input-style:focus { border-color: #38bdf8; background: #0f172a; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        
        .alert-banner { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 12px; border-radius: 12px; font-size: 13px; text-align: center; margin-bottom: 20px; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #0f172a; border: none; padding: 15px; font-size: 16px; font-weight: 700; border-radius: 14px; cursor: pointer; transition: all 0.2s; box-shadow: 0 10px 20px rgba(56, 189, 248, 0.25); }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 15px 25px rgba(56, 189, 248, 0.35); }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="glass-card">
            <div class="top-switcher">
                <a href="{{ url_for('admin_login') }}" class="switch-btn admin-pill">⚙ Admin Gateway</a>
                <a href="{{ url_for('signup') }}" class="switch-btn signup-pill">📝 Sign Up</a>
            </div>
            <div class="brand-header">
                <h1>Travel<span>Go</span></h1>
                <p>Sign in to map routes and manage journeys</p>
            </div>
            {% if msg %}
                <div class="alert-banner">⚠️ {{ msg }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('user_login') }}">
                <div class="form-group">
                    <label>Email Account</label>
                    <input type="email" name="email" class="input-style" placeholder="passenger@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password Access Key</label>
                    <input type="password" name="password" class="input-style" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Sign In Securely</button>
            </form>
        </div>
    </div>
</body>
</html>
