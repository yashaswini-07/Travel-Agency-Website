<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelGo - Join the Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.65)), 
                        url('https://images.unsplash.com/photo-1527631746610-bca00a040d60?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover fixed;
            padding: 30px 20px;
        }
        .auth-container { width: 100%; max-width: 480px; z-index: 10; }
        .glass-card {
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12); padding: 35px; border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }
        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-header h1 { font-size: 28px; font-weight: 700; color: #f8fafc; }
        .brand-header h1 span { color: #34d399; text-shadow: 0 0 20px rgba(52, 211, 153, 0.3); }
        .brand-header p { color: #cbd5e1; font-size: 14px; margin-top: 4px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .full-width { grid-column: span 2; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-style { width: 100%; padding: 12px 16px; background: rgba(15, 23, 42, 0.8); border: 2px solid #334155; border-radius: 12px; color: white; font-size: 14px; outline: none; transition: all 0.2s; }
        .input-style:focus { border-color: #34d399; background: #0f172a; box-shadow: 0 0 12px rgba(52, 211, 153, 0.2); }
        
        .error-box { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 12px; border-radius: 12px; font-size: 13px; text-align: center; margin-bottom: 15px; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #34d399 0%, #059669 100%); color: #064e3b; border: none; padding: 14px; font-size: 15px; font-weight: 700; border-radius: 12px; cursor: pointer; transition: all 0.2s; margin-top: 5px; }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(52, 211, 153, 0.3); }
        .login-foot { text-align: center; margin-top: 20px; font-size: 14px; color: #cbd5e1; }
        .login-foot a { color: #38bdf8; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="glass-card">
            <div class="brand-header">
                <h1>Create <span>Profile</span></h1>
                <p>Sign up to explore itineraries & lock bookings</p>
            </div>
            {% if error %}
                <div class="error-box">⚠️ {{ error }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('signup') }}">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Full Name</label>
                        <input type="text" name="name" class="input-style" placeholder="Your Name" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Email Address</label>
                        <input type="email" name="email" class="input-style" placeholder="name@example.com" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Password Setup</label>
                        <input type="password" name="password" class="input-style" placeholder="Create Access Password" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" name="phone" class="input-style" placeholder="9876543210">
                    </div>
                    <div class="form-group">
                        <label>City Location</label>
                        <input type="text" name="address" class="input-style" placeholder="Karnataka, India">
                    </div>
                </div>
                <button type="submit" class="btn-submit">Register Account</button>
            </form>
            <div class="login-foot">
                Already registered? <a href="{{ url_for('user_login') }}">Log In</a>
            </div>
        </div>
    </div>
</body>
</html>
