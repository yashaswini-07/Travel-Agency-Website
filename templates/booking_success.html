<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TravelGo - Booking Confirmed</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #eef2f3; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .success-card { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 480px; 
            width: 100%; 
            box-sizing: border-box;
        }
        .success-icon {
            font-size: 50px;
            color: #28a745;
            margin-bottom: 10px;
        }
        h1 { 
            color: #28a745; 
            margin-top: 0;
            margin-bottom: 10px; 
            font-size: 26px;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 15px;
        }
        .ticket-box { 
            background: #f8f9fa; 
            padding: 20px; 
            border-radius: 8px; 
            text-align: left; 
            margin-bottom: 25px; 
            border-left: 5px solid #28a745; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 8px;
        }
        .info-row:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }
        .info-label {
            font-weight: bold;
            color: #4a5568;
            font-size: 14px;
        }
        .info-value {
            color: #1a202c;
            font-size: 14px;
            font-weight: 500;
        }
        .time-highlight {
            color: #2b6cb0;
            font-family: monospace;
            font-weight: bold;
        }
        .btn-home { 
            display: block; 
            padding: 12px; 
            background: #007bff; 
            color: white; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn-home:hover { 
            background: #0056b3; 
        }
    </style>
</head>
<body>

<div class="success-card">
    <div class="success-icon">🎉</div>
    <h1>Booking Confirmed!</h1>
    <p class="subtitle">Your reservation has been saved directly to our database ledger.</p>
    
    <div class="ticket-box">
        <div class="info-row">
            <span class="info-label">Train Assignment:</span>
            <span class="info-value" style="color: #2c3e50; font-weight: bold;">{{ train }}</span>
        </div>
        <div class="info-row">
            <span class="info-label">Total Seats Booked:</span>
            <span class="info-value">{{ seats }} Seat(s)</span>
        </div>
        <div class="info-row">
            <span class="info-label">Female Passenger Count:</span>
            <span class="info-value">{{ females }}</span>
        </div>
        <div class="info-row">
            <span class="info-label">Departure Window:</span>
            <span class="info-value time-highlight">{{ departure }}</span>
        </div>
        <div class="info-row">
            <span class="info-label">Arrival Window:</span>
            <span class="info-value time-highlight">{{ arrival }}</span>
        </div>
    </div>

    <a href="/home" class="btn-home">Back to Search Console</a>
</div>

</body>
</html>
