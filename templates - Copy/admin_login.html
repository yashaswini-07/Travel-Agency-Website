<!DOCTYPE html>
<html lang="en">
<head>
    <title>TravelGo - Admin Gate</title>
    <style>
        body { font-family: Arial, sans-serif; background: #2c3e50; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 320px; }
        h2 { text-align: center; color: #e74c3c; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0 16px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #c0392b; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Admin Portal</h2>
        <form method="POST">
            <label>Admin Email</label>
            <input type="email" name="email" placeholder="travelgo@gamail.com" required>
            
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
            
            <button type="submit">Verify & Enter Database</button>
        </form>
    </div>

</body>
</html>
