<!DOCTYPE html>
<html lang="en">
<head>
    <title>TravelGo - Welcome</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f3; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; position: relative; }
        .admin-btn { position: absolute; top: 20px; left: 20px; background: #343a40; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 14px; }
        .admin-btn:hover { background: #23272b; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 320px; }
        h2 { text-align: center; color: #007bff; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0 16px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <a href="/admin" class="admin-btn">Admin Login ⚙️</a>

    <div class="login-card">
        <h2>Passenger Login</h2>
        <form method="POST">
            <label>Email ID</label>
            <input type="email" name="email" placeholder="passenger@example.com" required>
            
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter Password" required>
            
            <button type="submit">Log In</button>
        </form>
    </div>

</body>
</html>
